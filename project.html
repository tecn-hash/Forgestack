<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project code & Ecosystem Generator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--Google Fonts: Inter & JetBrains Mono-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwindcss.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        jetbrains: ['JetBrains Mono', 'monospace'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Suble custom transitions & scrollbar polish */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-row {
            animation: fadeSlideIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">


<!-- Top Navigation Header -->
 <header class="bg-white border-b border-slate-200 sticky top-0 z-20>
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
                <svg xmins="http://www.w3.org/2000/svg" class="w-5 h-5" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9h16"/<>path d="M4 15h16"/<>path d="M10 3L8 21"/<><path d="M16 3l-2 18"/>
                </svg>
            </div>
        <div>
            <h1 class="text-base sm:text=lg font-bold tracking-tight text-slate-900">Project code Studio</h1>
            <p class="text-xs text-slate-500 hidden sm:block">Standardized naming &amp; ecosystem generation</p>
        </div>
    </div>

    <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emarald-50 text-emarald-700 border border-emarald-200">
            <span class="w-1.5 h-1.5 rounded-full bg-emarald-500"></span>
            0/I/L Safe-Filter Active
        </span>
    </div>
</div>
</header>

<!-- Main Workspace--><main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-8">


<!-- Top Grid: Configuration (left) & Live Ecosystem Output (Right)-->
 <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 item-start">

    <!-- Left Panel: Generator Controls -->
     <section class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6 space-y-6">
        <div>
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">1. Choosing Naming Conention</h2>
            <div id="presetSelector" class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <!-- Present cards injected via JS-->
            </div>
        </div>

        <hr class="border-slate-100" />

        <!-- Dynamic Form Inputs -->
        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold uppercase tracking-width text-slate-400">2. Configure Segments</h2>
                <span id="formatBadge" class="font-mono text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold">CLIENT-YEAR-SEQ</span>
            </div>
           
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Primary Entity Input (Client / Dept /Product) -->
                <div id="entityFieldGroup" class="sm:col-span-2">
                    <div class="flex item-center justify-between mb-1.5">
                        <label id="entityLabel" for="entityNameInput" class="block text-sm font-medium text-slate-700">Client or Department Name</label>
                        <span class="text-xs text-slate-400">Auto-generates 3-letter code</span>
                    </div>
                    <div class="flex gap-2">
                        <input
                        type="text"
                        id="entityNameInput"
                        placeholder="e.g., Acme Corp or Marketing"
                        value="Acme Corp"
                        class="flex-1 rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                    />
                    <div class="w-28 relative">
                        <input
                        type="text"
                        id="prefixCodeInput"
                        maxlength="4"
                        value="ACM"
                        aria-label="Prefix Code"
                        tittle="Editable uppercase prefix code"
                        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-center font-mono text-sm font-bold uppercase text-indigo-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                    />
                    <span class="block text-[10px] text-center text-amber-400 mt-1">Prefix</span>
                 </div>
             </div>
             <p id="ambiguousNotice" class="hidden mt-1.5 text-xs text-amber-600 flex items-center gap-1">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stoke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Replace look-alike characters (0, I, L) for visual clarity.</span>
             </p>
            </div>

            <!-- Year Selector -->


     </section>
 </div>
